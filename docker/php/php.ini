; ==========================================
; Some hardened settings and reasonable defaults
; ==========================================

; Prevent PHP from advertising its presence in HTTP headers
expose_php = Off

; Disable error display in production to prevent path disclosure
display_errors = Off
display_startup_errors = Off
track_errors = Off
html_errors = Off

; Enable error logging instead
log_errors = On
error_reporting = E_ALL
; Log to standard error/Apache log so Docker can capture it
error_log = /dev/stderr

; Restrict PHP access to the application root only (and /tmp for uploads)
; (also some other paths, for composer)
open_basedir = /var/www/cyberpunk:/tmp:/usr/bin:/root

; Disable remote file execution (CRITICAL)
allow_url_fopen = Off
allow_url_include = Off

; Disable register_argc_argv to prevent command line argument parsing (obv change this if you're building some CLI thing)
register_argc_argv = Off

; Prevent session ID generation from script input (Session Fixation)
session.use_strict_mode = 1

; Ensure session ID is only stored in cookies, not URLs
session.use_only_cookies = 1
session.use_trans_sid = 0

; Secure session cookies
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
; Set cookie_secure to 1 if using HTTPS in production (commented out for local HTTP dev compatibility)
; session.cookie_secure = 1

; Maximum execution time of each script, in seconds
max_execution_time = 30

; Maximum amount of time each script may spend parsing request data
max_input_time = 60

; Maximum number of input variables (prevents Hash Collision DoS)
max_input_vars = 1000

; Maximum amount of memory a script may consume
memory_limit = 128M

; Maximum size of POST data that PHP will accept
post_max_size = 10M

; Maximum allowed size for uploaded files
upload_max_filesize = 10M

; Disable functions that allow shell access or system-level command execution
; we need to allow proc_open for composer stuff
disable_functions = exec,passthru,shell_exec,system,popen,show_source,symlink,parse_ini_file
