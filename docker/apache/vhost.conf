<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/cyberpunk/public

    # Web-SAPI filesystem jail. php_admin_value cannot be overridden by
    # .htaccess or ini_set(), so this is stricter than setting it in php.ini.
    # /tmp is required for sessions and uploads; the app tree covers the rest.
    php_admin_value open_basedir "/var/www/cyberpunk:/tmp"

    <Directory /var/www/cyberpunk/public>
        # Indexes off: Laravel's public/ should never be browsable.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
