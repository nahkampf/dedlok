name: Deploy on Tag Push
on:
  push:
    tags:
      - '*' # Triggers on tags like v1.0, v2.1.0, etc. Adjust pattern if needed.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Send Deployment Webhook
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # Send POST request and save HTTP status and body response
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://dedlok.online/deploy.php \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "key=${DEPLOY_KEY}")

          # Extract body and status code
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          # Check for HTTP errors first
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Server returned HTTP status $STATUS"
            echo "$BODY"
            exit 1
          fi

          # Evaluate payload response
          if [ "$BODY" = "1" ]; then
            echo "Deployment triggered successfully (received 1)."
          else
            echo "::error::Deployment failed: $BODY"
            exit 1
          fi
